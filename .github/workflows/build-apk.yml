name: Build APK
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install -y default-jdk-headless aapt apksigner zipalign dalvik-exchange libandroid-23-java

      - name: Restore signing key
        env:
          KS_B64: "${{ secrets.KEYSTORE_B64 }}"
        run: |
          test -n "$KS_B64" || { echo "::error::Secret KEYSTORE_B64 is missing."; exit 1; }
          mkdir -p signing && printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > signing/sweldopulse.jks

      - name: Build APK
        env:
          KEYSTORE_PASS: "${{ secrets.KEYSTORE_PASS }}"
          CI: "true"
        run: chmod +x ./scripts/build_apk.sh && ./scripts/build_apk.sh

      - name: Locate the APK for this version
        id: apk
        run: |
          VER=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          echo "path=SweldoPulse-v$VER.apk" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VER" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.json ($VER)"
            exit 1
          fi
          ls -la "SweldoPulse-v$VER.apk"

      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: "${{ vars.EXPECTED_CERT_SHA256 }}"
        run: |
          APK_FILE="${{ steps.apk.outputs.path }}"
          FP=$(apksigner verify --print-certs "$APK_FILE" | grep -i -m1 'SHA-256 digest:' | awk -F': ' '{print $2}' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')
          echo "APK SHA-256: $FP"
          test -n "$FP" || { echo "::error::Could not read APK signing certificate."; exit 1; }
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXPECTED_CLEAN=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
            FP_CLEAN=$(printf '%s' "$FP" | tr -d ':[:space:]')
            test "$FP_CLEAN" = "$EXPECTED_CLEAN" || { echo "::error::Wrong signing key ($FP)"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SweldoPulse-apk
          path: "${{ steps.apk.outputs.path }}"

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "${{ steps.apk.outputs.path }}"
