name: Build APK
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
env:
  # SHA-256 of YOUR signing certificate. The build fails if the APK is signed with anything else,
  # because Android refuses to update an installed app with a differently-signed APK ("package conflicts").
  EXPECTED_CERT_SHA256: "13:7A:FF:61:73:9F:82:04:3B:97:99:EE:C4:D3:83:37:95:AB:DF:9F:7B:5B:6A:8D:B6:7C:28:E4:93:C5:67:CB"
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y default-jdk-headless aapt apksigner zipalign dalvik-exchange libandroid-23-java
      - name: Restore signing key (repo secret KEYSTORE_B64)
        env: { KS_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          test -n "$KS_B64" || { echo "::error::Secret KEYSTORE_B64 is missing. Refusing to build with a new random key."; exit 1; }
          mkdir -p signing && echo "$KS_B64" | base64 -d > signing/sweldopulse.jks
      - run: ./scripts/build_apk.sh
        env: { KEYSTORE_PASS: "${{ secrets.KEYSTORE_PASS }}", CI: "true" }
      - name: Verify signing certificate matches the installed app
        run: |
          FP=$(keytool -printcert -jarfile SweldoPulse-v*.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "APK certificate: $FP"
          test "$FP" = "$EXPECTED_CERT_SHA256" || { echo "::error::Wrong signing key ($FP). It will not update your installed app."; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: SweldoPulse-apk, path: "SweldoPulse-v*.apk" }
      - name: Attach APK to the GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "SweldoPulse-v*.apk" }
