name: Build APK
on: { workflow_dispatch: {}, push: { tags: ['v*'] } }
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y default-jdk-headless aapt apksigner zipalign dalvik-exchange libandroid-23-java
      - name: Restore signing key (from repo secret KEYSTORE_B64)
        run: mkdir -p signing && echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > signing/sweldopulse.jks
      - run: bash ./scripts/build_apk.sh
        env: { KEYSTORE_PASS: "${{ secrets.KEYSTORE_PASS }}" }
      - uses: actions/upload-artifact@v4
        with: { name: SweldoPulse-apk, path: "SweldoPulse-v*.apk" }
      - name: Attach APK to the GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "SweldoPulse-v*.apk" }
